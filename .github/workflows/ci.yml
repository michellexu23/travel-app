# Continuous Integration: runs on every push to main and on every pull request.
# If any step fails, the commit gets a red X on GitHub.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: this workflow can only read the repo, not write to it.
permissions:
  contents: read

# If you push twice quickly, cancel the older run instead of running both.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      # `npm ci` installs exactly what package-lock.json says (reproducible),
      # unlike `npm install`, which may update the lock file.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck
